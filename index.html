<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Núcleo Carrizal</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .iframe-mode {
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .ficha-wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ficha-card {
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .ficha-header {
      background: #0284c7;
      color: #ffffff;
      padding: 16px 18px;
    }
    .ficha-header .sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      font-weight: bold;
    }
    .ficha-header h1 {
      margin: 4px 0 0 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .ficha-inv {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }
    .ficha-body {
      padding: 16px 18px;
    }
    .fila {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }
    .fila:last-child {
      border-bottom: none;
    }
    .etiqueta {
      color: #64748b;
      font-weight: 600;
      flex-shrink: 0;
    }
    .valor {
      color: #0f172a;
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }
    .comodato-box {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      border-radius: 8px;
    }
    .comodato-titulo {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      color: #0284c7;
      margin-bottom: 6px;
    }
    .estado-msg {
      text-align: center;
      padding: 28px 18px;
      font-size: 15px;
      line-height: 1.5;
    }
    .error-msg {
      color: #b91c1c;
      font-weight: bold;
    }
    .btn-inicio {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqMLhfFAQcnSPAsS2NU77_DSkGrmzOcZUj6Pd_1S_6AhQ41d67gfwEgyJB18ZTnewNt/exec";
    const params = new URLSearchParams(window.location.search);
    const invParam = (params.get("inv") || params.get("INV") || "").trim();
    const appEl = document.getElementById("app");

    function escapeHtml(txt) {
      return String(txt || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    if (!invParam) {
      document.body.classList.add("iframe-mode");
      appEl.innerHTML = `<iframe src="${escapeHtml(APPS_SCRIPT_URL)}" allow="fullscreen"></iframe>`;
    } else {
      appEl.innerHTML = `
        <div class="ficha-wrapper">
          <div class="ficha-card">
            <div class="estado-msg">🔄 Consultando inventario <b>${escapeHtml(invParam)}</b>...</div>
          </div>
        </div>
      `;

      const endpoint = `${APPS_SCRIPT_URL}?inv=${encodeURIComponent(invParam)}`;

      fetch(endpoint)
        .then(res => {
          if (!res.ok) throw new Error("No se pudo conectar con el servidor de inventario.");
          return res.json();
        })
        .then(data => {
          if (!data || !data.success) {
            throw new Error((data && data.error) || "Instrumento no encontrado.");
          }

          const comodatoHtml = data.mostrarComodato ? `
            <div class="comodato-box">
              <div class="comodato-titulo">Datos de Comodato / Asignación</div>
              <div class="fila"><span class="etiqueta">Acta / Correlativo:</span><span class="valor">${escapeHtml(data.correlativoComodato)}</span></div>
              <div class="fila"><span class="etiqueta">Asignado a:</span><span class="valor">${escapeHtml(data.asignadoA)}</span></div>
              <div class="fila"><span class="etiqueta">Fecha inicio:</span><span class="valor">${escapeHtml(data.fechaInicioComodato)}</span></div>
              <div class="fila"><span class="etiqueta">Estado comodato:</span><span class="valor">${escapeHtml(data.estadoComodato)}</span></div>
            </div>
          ` : "";

          appEl.innerHTML = `
            <div class="ficha-wrapper">
              <div class="ficha-card">
                <div class="ficha-header">
                  <div class="sub">El Sistema · Núcleo Carrizal</div>
                  <h1>${escapeHtml(data.instrumento)}</h1>
                  <div class="ficha-inv">INV: ${escapeHtml(data.inv)}</div>
                </div>
                <div class="ficha-body">
                  <div class="fila"><span class="etiqueta">Marca / Detalle:</span><span class="valor">${escapeHtml(data.marca)}</span></div>
                  <div class="fila"><span class="etiqueta">Serial:</span><span class="valor">${escapeHtml(data.serial)}</span></div>
                  <div class="fila"><span class="etiqueta">Condición:</span><span class="valor">${escapeHtml(data.condicion)}</span></div>
                  <div class="fila"><span class="etiqueta">Ubicación:</span><span class="valor">${escapeHtml(data.ubicacion)}</span></div>
                  <div class="fila"><span class="etiqueta">Observaciones:</span><span class="valor">${escapeHtml(data.observaciones)}</span></div>
                  ${comodatoHtml}
                </div>
              </div>
            </div>
          `;
        })
        .catch(err => {
          appEl.innerHTML = `
            <div class="ficha-wrapper">
              <div class="ficha-card">
                <div class="estado-msg">
                  <div class="error-msg">⚠️ ${escapeHtml(err.message || "Error al consultar el instrumento.")}</div>
                  <a class="btn-inicio" href="${escapeHtml(window.location.pathname)}">Ir al inventario</a>
                </div>
              </div>
            </div>
          `;
        });
    }
  </script>
</body>
</html>
