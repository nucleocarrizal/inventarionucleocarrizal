<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Instrumento - Núcleo Carrizal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Architects Daughter', 'Inter', Arial, sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
    }
    .iframe-mode {
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .page-wrapper {
      min-height: 100vh;
      padding: 18px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .ficha-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 22px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    .ficha-header {
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 2px solid #0284c7;
      margin-bottom: 18px;
    }
    .ficha-titulo {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #0284c7;
      text-transform: uppercase;
    }
    .ficha-subtitulo {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #475569;
      text-transform: uppercase;
    }
    .campo {
      margin-bottom: 15px;
    }
    .campo:last-child {
      margin-bottom: 0;
    }
    .campo-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 3px;
    }
    .campo-valor {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      word-break: break-word;
    }
    .inv-destacado {
      font-size: 19px;
      color: #0284c7;
      letter-spacing: 0.5px;
    }
    .badge-condicion {
      display: inline-block;
      background-color: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-inoperativo {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .estado-box {
      text-align: center;
      padding: 24px 10px;
      font-size: 15px;
      line-height: 1.5;
    }
    .error-text {
      color: #b91c1c;
      font-weight: 700;
    }
    .btn-volver {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqMLhfAQCnSPAsS2NU77_DSkGrmzOCzUj6Pd_lS_6AhQ41d67gfwEgyJBl8ZTnewNt/exec";
    const params = new URLSearchParams(window.location.search);
    const invParam = (params.get("inv") || params.get("INV") || "").trim();
    const appEl = document.getElementById("app");

    function escapeHtml(txt) {
      return String(txt || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderError(mensaje, urlIntento) {
      const detalleUrl = urlIntento
        ? `<div style="margin-top:10px; font-size:11px; color:#64748b; word-break:break-all;">${escapeHtml(urlIntento)}</div>`
        : "";

      appEl.innerHTML = `
        <div class="page-wrapper">
          <div class="ficha-card">
            <div class="ficha-header">
              <h1 class="ficha-titulo">Ficha de Instrumento</h1>
              <div class="ficha-subtitulo">Sistema · Núcleo Carrizal</div>
            </div>
            <div class="estado-box">
              <div class="error-text">⚠️ ${escapeHtml(mensaje)}</div>
              ${detalleUrl}
              <a class="btn-volver" href="${escapeHtml(window.location.pathname)}">Ir al inventario</a>
            </div>
          </div>
        </div>
      `;
    }

    if (!invParam) {
      document.body.classList.add("iframe-mode");
      appEl.innerHTML = `<iframe src="${escapeHtml(APPS_SCRIPT_URL)}" allow="fullscreen"></iframe>`;
    } else {
      appEl.innerHTML = `
        <div class="page-wrapper">
          <div class="ficha-card">
            <div class="ficha-header">
              <h1 class="ficha-titulo">Ficha de Instrumento</h1>
              <div class="ficha-subtitulo">Sistema · Núcleo Carrizal</div>
            </div>
            <div class="estado-box">🔄 Consultando inventario <b>${escapeHtml(invParam)}</b>...</div>
          </div>
        </div>
      `;

      const callbackName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const scriptUrl = `${APPS_SCRIPT_URL}?inv=${encodeURIComponent(invParam)}&callback=${callbackName}`;
      let respondido = false;

      const timer = setTimeout(() => {
        if (respondido) return;
        respondido = true;
        delete window[callbackName];
        renderError("El servidor tardó demasiado en responder.", scriptUrl);
      }, 12000);

      window[callbackName] = function(data) {
        if (respondido) return;
        respondido = true;
        clearTimeout(timer);
        delete window[callbackName];

        if (!data || !data.success) {
          renderError((data && data.error) || "Instrumento no encontrado.");
          return;
        }

        const condStr = (data.condicion || "OPERATIVO").toString().trim();
        const esMalEstado = /INOPERATIV|DANAD|MAL|REPARACION/i.test(condStr);
        const badgeClass = esMalEstado ? "badge-condicion badge-inoperativo" : "badge-condicion";

        const asignadoHtml = data.mostrarComodato ? `
          <div class="campo">
            <div class="campo-label">Asignado a</div>
            <div class="campo-valor">${escapeHtml(data.asignadoA || "N/A")}</div>
          </div>
        ` : "";

        appEl.innerHTML = `
          <div class="page-wrapper">
            <div class="ficha-card">
              <div class="ficha-header">
                <h1 class="ficha-titulo">Ficha de Instrumento</h1>
                <div class="ficha-subtitulo">Sistema · Núcleo Carrizal</div>
              </div>

              <div class="campo">
                <div class="campo-label">N° Inventario</div>
                <div class="campo-valor inv-destacado">${escapeHtml(data.inv)}</div>
              </div>

              <div class="campo">
                <div class="campo-label">Instrumento</div>
                <div class="campo-valor">${escapeHtml(data.instrumento)}</div>
              </div>

              <div class="campo">
                <div class="campo-label">Marca / Modelo / Medida</div>
                <div class="campo-valor">${escapeHtml(data.marca)}</div>
              </div>

              <div class="campo">
                <div class="campo-label">Serial</div>
                <div class="campo-valor">${escapeHtml(data.serial)}</div>
              </div>

              <div class="campo">
                <div class="campo-label">Condición</div>
                <div class="campo-valor"><span class="${badgeClass}">${escapeHtml(condStr)}</span></div>
              </div>

              <div class="campo">
                <div class="campo-label">Ubicación actual</div>
                <div class="campo-valor">${escapeHtml(data.ubicacion)}</div>
              </div>

              ${asignadoHtml}

              <div class="campo">
                <div class="campo-label">Observaciones</div>
                <div class="campo-valor">${escapeHtml(data.observaciones)}</div>
              </div>
            </div>
          </div>
        `;
      };

      const scriptTag = document.createElement("script");
      scriptTag.src = scriptUrl;
      scriptTag.referrerPolicy = "no-referrer";
      scriptTag.onerror = function() {
        if (respondido) return;
        respondido = true;
        clearTimeout(timer);
        delete window[callbackName];
        renderError("No se pudo conectar con el servidor de inventario.", scriptUrl);
      };
      document.body.appendChild(scriptTag);
    }
  </script>
</body>
</html>
